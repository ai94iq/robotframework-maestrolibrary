# Device-free checks on every push and pull request: unit tests with a coverage gate (the fake MCP
# server stands in for Maestro), security scans, a Robot dry run of the acceptance suites, libdoc,
# build and twine check. The acceptance suites themselves need an Android device or emulator.
# Studio's Qt tests run offscreen on Linux, Windows and macOS.
# A vX.Y.Z tag also publishes to PyPI with trusted publishing (docs/distribution.md) and attaches Studio desktop
# bundles (Windows .exe, Linux .tar.gz, macOS .dmg) to the GitHub release; every run builds and checks them.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python: ['3.12', '3.14']   # the floor in pyproject.toml and the latest release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3   # Qt (Studio)
      - run: python -m pip install -q -U pip
      - run: python -m pip install -q -e ".[convert,studio]" pytest coverage bandit pip-audit "build>=1.6.1" "twine>=7.0.0"
      - run: python -m coverage run --branch --source=src/MaestroLibrary -m pytest -q utest
      - run: python -m coverage report --fail-under=85
      - run: python -m bandit -q -c pyproject.toml -r src
      # Audit what this package depends on, extras included, not the runner's own tools.
      - run: |
          python -c "import tomllib; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; print(chr(10).join(p['dependencies'] + [d for e in p['optional-dependencies'].values() for d in e]))" > deps.txt
          python -m pip_audit -r deps.txt
      - run: python -m robot --dryrun --output NONE --report NONE --log NONE atest
      - run: python -m robot.libdoc MaestroLibrary MaestroLibrary.html
      - run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.python == '3.14'
        with:
          name: dist
          path: |
            dist/
            MaestroLibrary.html

  studio:
    # Studio's window, decoder and stream tests on Windows and macOS (the check jobs run them on Linux).
    strategy:
      fail-fast: false   # each platform reports its own result
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -q -U pip
      - run: python -m pip install -q -e ".[studio]" pytest
      - run: python -m pytest -q utest/test_studio.py utest/test_studio_qt.py

  bundles:
    # Studio desktop bundles: an LGPL, decode-only FFmpeg (no x264 or x265), PyAV built on it, PyInstaller, and the
    # bundle's own --self-check, which fails the job on any GPL or nonfree part (packaging/build_bundle.py).
    # Every push and pull request builds and checks all four; only a tag attaches them to a release.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - id: key
        shell: bash
        run: echo "ffmpeg=ffmpeg-${{ matrix.os }}-$(python -c "import hashlib; print(hashlib.sha256(open('packaging/build_ffmpeg.py', 'rb').read()).hexdigest()[:16])")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: cache
        with:
          path: ffmpeg
          key: ${{ steps.key.outputs.ffmpeg }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm pkg-config libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - if: runner.os == 'macOS'
        run: brew install nasm pkgconf
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit   # keeps MSVC's cl.exe and the runner's Python on PATH
          install: make diffutils pkgconf mingw-w64-ucrt-x86_64-nasm
      - if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          rm -f /usr/bin/link.exe   # MSYS2's coreutils link would shadow MSVC's linker
          python packaging/build_ffmpeg.py ffmpeg
      - if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
        run: python packaging/build_ffmpeg.py ffmpeg
      - run: python packaging/build_bundle.py ffmpeg bundles
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: bundles/

  release-bundles:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, studio, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach files to the GitHub release, this job only
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          version=$(python3 -c 'import ast; t=open("src/MaestroLibrary/__init__.py").read(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "__version__"][0])')
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles
      - run: cd bundles && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: bundles/*
          body_path: packaging/release-notes.md

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, studio]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing, no stored token
    steps:
      - uses: actions/checkout@v7.0.1
      # The tag must equal the code's version, or PyPI would hold a mislabelled release.
      - run: |
          version=$(python3 -c 'import ast; t=open("src/MaestroLibrary/__init__.py").read(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "__version__"][0])')
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
