# Device-free checks on every push and pull request: unit tests with a coverage gate (the fake MCP
# server stands in for Maestro), security scans, a Robot dry run of the acceptance suites, libdoc,
# build and twine check. The acceptance suites themselves need an Android device or emulator.
# A vX.Y.Z tag also publishes to PyPI with trusted publishing (docs/distribution.md).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']   # the floor in pyproject.toml and the latest release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q -U pip
      - run: python -m pip install -q -e ".[convert]" pytest coverage bandit pip-audit "build>=1.6.1" "twine>=7.0.0"
      - run: python -m coverage run --branch --source=src/MaestroLibrary -m pytest -q utest
      - run: python -m coverage report --fail-under=85
      - run: python -m bandit -q -c pyproject.toml -r src
      # Audit what this package depends on, not the runner's own tools.
      - run: |
          python -c "import tomllib; print(chr(10).join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > deps.txt
          python -m pip_audit -r deps.txt
      - run: python -m robot --dryrun --output NONE --report NONE --log NONE atest
      - run: python -m robot.libdoc MaestroLibrary MaestroLibrary.html
      - run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.python == '3.14'
        with:
          name: dist
          path: |
            dist/
            MaestroLibrary.html

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing, no stored token
    steps:
      - uses: actions/checkout@v7.0.1
      # The tag must equal the code's version, or PyPI would hold a mislabelled release.
      - run: |
          version=$(python3 -c 'import ast; t=open("src/MaestroLibrary/__init__.py").read(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and getattr(n.targets[0], "id", "") == "__version__"][0])')
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
